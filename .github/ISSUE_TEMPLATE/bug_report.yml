name: Bug report
description: Report a reproducible problem in CiviVerify.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not include verification tokens, personal data, credentials,
        or other sensitive information. Report security issues privately as
        described in SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      placeholder: Include CiviCRM, PHP, and CiviVerify versions.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
